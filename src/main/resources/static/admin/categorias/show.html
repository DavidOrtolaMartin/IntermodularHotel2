<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ver categoría</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/app.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
		
	<style>
	        .cat-page { font-family: 'DM Sans', sans-serif; }
	 
	        .cat-header {
	            display: flex;
	            align-items: flex-end;
	            justify-content: space-between;
	            flex-wrap: wrap;
	            gap: 1rem;
	            margin-bottom: 2rem;
	            padding-bottom: 1.25rem;
	            border-bottom: 1px solid #e2e8f0;
	        }
	 
	        .cat-header h1 {
	            font-family: 'Playfair Display', serif;
	            font-size: 2rem;
	            color: #0b3b66;
	            margin: 0;
	        }
	 
	        .cat-header .subtitle {
	            font-size: 0.875rem;
	            color: #64748b;
	            margin-top: 0.2rem;
	        }
	 
	        .cat-header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
	 
	        .btn-back {
	            display: inline-flex; align-items: center; gap: 0.4rem;
	            padding: 0.5rem 1.1rem; border-radius: 999px;
	            border: 1.5px solid #cbd5e1; background: white;
	            color: #334155; font-size: 0.875rem; font-weight: 500;
	            text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s;
	        }
	        .btn-back:hover { border-color: #2563eb; color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
	 
	        .btn-edit {
	            display: inline-flex; align-items: center; gap: 0.4rem;
	            padding: 0.5rem 1.2rem; border-radius: 999px; border: none;
	            background: linear-gradient(135deg, #2563eb, #1d4ed8);
	            color: white; font-size: 0.875rem; font-weight: 600;
	            text-decoration: none; box-shadow: 0 3px 10px rgba(37,99,235,0.25);
	            transition: transform 0.18s, box-shadow 0.18s;
	        }
	        .btn-edit:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37,99,235,0.35); color: white; }
	 
	        /* Info card */
	        .info-card {
	            background: white;
	            border-radius: 16px;
	            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
	            border: 1px solid #f1f5f9;
	            overflow: hidden;
	            margin-bottom: 2rem;
	            display: flex;
	            flex-wrap: wrap;
	        }
	 
	        .info-card-img {
	            width: 280px;
	            flex-shrink: 0;
	            object-fit: cover;
	        }
	 
	        .info-card-img-placeholder {
	            width: 280px;
	            flex-shrink: 0;
	            background: linear-gradient(135deg, #e0eaff, #dbeafe);
	            display: flex; align-items: center; justify-content: center;
	            color: #93c5fd; font-size: 3rem; min-height: 200px;
	        }
	 
	        .info-card-body {
	            padding: 1.75rem 2rem;
	            flex: 1;
	            display: flex; flex-direction: column; gap: 1rem;
	        }
	 
	        .info-label {
	            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.07em;
	            text-transform: uppercase; color: #94a3b8; margin-bottom: 0.15rem;
	        }
	 
	        .info-nombre {
	            font-family: 'Playfair Display', serif;
	            font-size: 1.6rem; color: #0b3b66; line-height: 1.2; margin: 0;
	        }
	 
	        .info-descripcion { font-size: 0.9rem; color: #475569; line-height: 1.6; margin: 0; }
	 
	        .info-precio {
	            display: inline-flex; align-items: baseline; gap: 0.3rem;
	            background: #eff6ff; border-radius: 999px;
	            padding: 0.4rem 1rem; width: fit-content;
	        }
	        .info-precio strong { font-size: 1.4rem; color: #2563eb; font-weight: 700; }
	        .info-precio span { font-size: 0.8rem; color: #60a5fa; }
	 
	        /* Sección galería */
	        .section-title {
	            font-family: 'Playfair Display', serif;
	            font-size: 1.3rem; color: #0b3b66;
	            margin-bottom: 1rem;
	        }
	 
	        /* Upload zone */
	        .upload-zone {
	            background: white; border-radius: 16px;
	            border: 2px dashed #e2e8f0;
	            padding: 1.5rem; margin-bottom: 2rem;
	            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
	            transition: border-color 0.2s;
	        }
	        .upload-zone:focus-within { border-color: #93c5fd; }
	 
	        .upload-zone input[type="file"] {
	            flex: 1; min-width: 200px;
	            border-radius: 10px !important;
	        }
	 
	        .btn-subir {
	            display: inline-flex; align-items: center; gap: 0.4rem;
	            padding: 0.5rem 1.2rem; border-radius: 999px; border: none;
	            background: linear-gradient(135deg, #059669, #047857);
	            color: white; font-size: 0.875rem; font-weight: 600;
	            cursor: pointer; box-shadow: 0 3px 10px rgba(5,150,105,0.25);
	            transition: transform 0.18s, box-shadow 0.18s;
	        }
	        .btn-subir:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(5,150,105,0.35); }
	 
	        /* Galería */
	        .galeria {
	            display: grid;
	            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
	            gap: 1rem;
	            margin-bottom: 2.5rem;
	        }
	 
	        .galeria-item {
	            position: relative; border-radius: 12px; overflow: hidden;
	            aspect-ratio: 1; cursor: pointer;
	            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
	            transition: transform 0.2s, box-shadow 0.2s;
	        }
	        .galeria-item:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(0,0,0,0.14); }
	 
	        .galeria-item img {
	            width: 100%; height: 100%; object-fit: cover; display: block;
	        }
	 
	        .galeria-item .badge-principal {
	            position: absolute; top: 8px; left: 8px;
	            background: rgba(37,99,235,0.9); color: white;
	            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em;
	            padding: 3px 8px; border-radius: 999px; text-transform: uppercase;
	        }
	 
	        /* Modal */
	        .modal-overlay {
	            display: none; position: fixed; inset: 0;
	            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
	            justify-content: center; align-items: center; z-index: 9999;
	        }
	        .modal-overlay.active { display: flex; }
	 
	        .modal-inner {
	            position: relative; max-width: 90vw; max-height: 90vh;
	        }
	 
	        .modal-inner img {
	            max-width: 90vw; max-height: 85vh;
	            border-radius: 12px; display: block;
	            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
	        }
	 
	        .modal-close {
	            position: absolute; top: -14px; right: -14px;
	            width: 32px; height: 32px; border-radius: 50%;
	            background: white; border: none; cursor: pointer;
	            display: flex; align-items: center; justify-content: center;
	            font-size: 1rem; font-weight: 700; color: #334155;
	            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
	            transition: background 0.15s;
	        }
	        .modal-close:hover { background: #f1f5f9; }
	 
	        @media (max-width: 600px) {
	            .info-card-img, .info-card-img-placeholder { width: 100%; min-height: 180px; }
	        }
	    </style>
</head>
<body class="cat-page">
 
<div class="container py-4">
 
    <!-- Cabecera -->
    <div class="cat-header">
        <div>
            <h1>Detalle de categoría</h1>
        </div>
        <div class="cat-header-actions">
            <a href="index.html" class="btn-back">← Volver</a>
            <a href="#" id="btn-editar" class="btn-edit">✎ Editar</a>
        </div>
    </div>
 
    <!-- Info principal -->
    <div class="info-card" id="info-card">
        <div class="info-card-img-placeholder" id="img-placeholder">
            <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M3.75 18h16.5M3.75 6h16.5A2.25 2.25 0 0 1 22.5 8.25v7.5A2.25 2.25 0 0 1 20.25 18H3.75A2.25 2.25 0 0 1 1.5 15.75v-7.5A2.25 2.25 0 0 1 3.75 6Z" />
            </svg>
        </div>
        <div class="info-card-body">
            <div>
                <p class="info-label">Nombre</p>
                <h2 class="info-nombre" id="nombre">—</h2>
            </div>
            <div>
                <p class="info-label">Descripción</p>
                <p class="info-descripcion" id="descripcion">—</p>
            </div>
            <div>
                <p class="info-label">Precio por noche</p>
                <div class="info-precio">
                    <strong id="precio">—</strong>
                    <span>€ / noche</span>
                </div>
            </div>
        </div>
    </div>
 
    <!-- Galería -->
    <h3 class="section-title">Galería de imágenes</h3>
 
    <div class="galeria" id="galeria"></div>
 
    <!-- Subir imagen -->
    <h3 class="section-title">Añadir imagen</h3>
    <div class="upload-zone">
        <input type="file" id="input-imagen" accept="image/*" class="form-control">
        <button id="btn-subir" class="btn-subir">↑ Subir imagen</button>
    </div>
 
</div>
 
<!-- Modal lightbox -->
<div class="modal-overlay" id="modal">
    <div class="modal-inner">
        <button class="modal-close" id="cerrar-modal">✕</button>
        <img id="modal-img" src="" alt="Imagen ampliada">
    </div>
</div>
 
<!-- imagen-principal oculta para compatibilidad con show.js -->
<img id="imagen-principal" style="display:none">
 
<script type="module" src="/js/admin/categorias/show.js"></script>

</body>
</html>
