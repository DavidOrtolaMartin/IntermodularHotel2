<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        .cat-page { font-family: 'DM Sans', sans-serif; }

        .cat-header {
            display: flex; align-items: flex-end;
            justify-content: space-between; flex-wrap: wrap;
            gap: 1rem; margin-bottom: 2rem;
            padding-bottom: 1.25rem; border-bottom: 1px solid #e2e8f0;
        }

        .cat-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66; margin: 0;
        }

        .cat-header .subtitle { font-size: 0.875rem; color: #64748b; margin-top: 0.2rem; }

        .cat-header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

        .btn-back {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.1rem; border-radius: 999px;
            border: 1.5px solid #cbd5e1; background: white;
            color: #334155; font-size: 0.875rem; font-weight: 500;
            text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .btn-back:hover { border-color: #2563eb; color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        /* Formulario en tarjeta */
        .form-card {
            background: white; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
            padding: 2rem; margin-bottom: 2rem;
        }

        .form-label-custom {
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em;
            text-transform: uppercase; color: #94a3b8; margin-bottom: 0.35rem;
            display: block;
        }

        .form-control {
            border-radius: 10px !important;
            border: 1.5px solid #e2e8f0 !important;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            padding: 0.6rem 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1) !important;
        }

        .form-actions {
            display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.75rem;
        }

        .btn-guardar {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.5rem; border-radius: 999px; border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 3px 10px rgba(37,99,235,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn-guardar:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37,99,235,0.35); }

        .btn-cancelar {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.3rem; border-radius: 999px;
            border: 1.5px solid #fca5a5; background: white;
            color: #ef4444; font-size: 0.9rem; font-weight: 500;
            text-decoration: none; transition: background 0.2s, border-color 0.2s;
        }
        .btn-cancelar:hover { background: #fef2f2; border-color: #ef4444; color: #ef4444; }

        /* Divisor de sección */
        .section-divider {
            display: flex; align-items: center; gap: 1rem;
            margin: 2rem 0 1.25rem;
        }
        .section-divider h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem; color: #0b3b66; margin: 0; white-space: nowrap;
        }
        .section-divider::after {
            content: ''; flex: 1; height: 1px; background: #e2e8f0;
        }

        /* Galería editable */
        .galeria-edit {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }

        .galeria-edit-item {
            position: relative; border-radius: 12px; overflow: hidden;
            aspect-ratio: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .galeria-edit-item:hover { transform: scale(1.02); }

        .galeria-edit-item img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        .galeria-edit-item .btn-borrar-img {
            position: absolute; top: 6px; right: 6px;
            width: 26px; height: 26px; border-radius: 50%;
            background: rgba(239,68,68,0.9); color: white;
            border: none; cursor: pointer; font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.15s;
        }
        .galeria-edit-item:hover .btn-borrar-img { opacity: 1; }

        /* Upload zone */
        .upload-zone {
            background: #f8fafc; border-radius: 12px;
            border: 2px dashed #e2e8f0; padding: 1.25rem;
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
            transition: border-color 0.2s;
        }
        .upload-zone:focus-within { border-color: #93c5fd; }

        .upload-zone input[type="file"] { flex: 1; min-width: 180px; }

        .btn-subir {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.2rem; border-radius: 999px; border: none;
            background: linear-gradient(135deg, #059669, #047857);
            color: white; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; box-shadow: 0 3px 10px rgba(5,150,105,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn-subir:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(5,150,105,0.35); }
    </style>
</head>
<body class="cat-page">

<div class="container py-4">

    <!-- Cabecera -->
    <div class="cat-header">
        <div>
            <h1>Editar categoría</h1>
            <p class="subtitle" id="cat-subtitle">Cargando…</p>
        </div>
        <div class="cat-header-actions">
            <a href="/admin/categorias/index.html" class="btn-back">← Volver</a>
        </div>
    </div>

    <!-- Formulario -->
    <div class="form-card">
        <form id="form-categoria">

            <div class="mb-4">
                <label class="form-label-custom" for="nombre">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Suite Junior">
            </div>

            <div class="mb-4">
                <label class="form-label-custom" for="descripcion">Descripción</label>
                <textarea id="descripcion" class="form-control" rows="3"
                    placeholder="Describe la categoría…" style="resize:vertical;"></textarea>
            </div>

            <div class="mb-4" style="max-width: 220px;">
                <label class="form-label-custom" for="precio">Precio por noche (€)</label>
                <input type="number" id="precio" class="form-control" min="1" step="1" placeholder="0">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-guardar">✓ Guardar cambios</button>
                <a href="/admin/categorias/index.html" class="btn-cancelar">✕ Cancelar</a>
            </div>

        </form>
    </div>

    <!-- Galería editable -->
    <div class="section-divider">
        <h3>Imágenes</h3>
    </div>

    <div class="galeria-edit" id="galeria-edit"></div>

    <!-- Subir imagen -->
    <div class="upload-zone">
        <input type="file" id="input-imagen" accept="image/*" class="form-control">
        <button id="btn-subir" class="btn-subir">↑ Subir imagen</button>
    </div>

</div>

<script>
    // Rellenar subtítulo con ID de URL
    const id = new URLSearchParams(window.location.search).get('id');
    if (id) document.getElementById('cat-subtitle').textContent = `Editando categoría con el ID ${id}`;

    // Estilizar galería-edit: añadir botón de borrar con hover a los elementos
    // que inserte el edit.js original
    const galeriaEl = document.getElementById('galeria-edit');
    const galeriaObserver = new MutationObserver(() => {
        galeriaEl.querySelectorAll('[data-img-wrap]').forEach(w => w.setAttribute('data-img-wrap', 'done'));
        // por si el JS original ya añade los items con clase o estilo propio, los envolvemos
        galeriaEl.querySelectorAll('img:not([data-wrapped])').forEach(img => {
            img.setAttribute('data-wrapped', '1');
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        });
    });
    galeriaObserver.observe(galeriaEl, { childList: true, subtree: true });
</script>

<script type="module" src="/js/admin/categorias/edit.js"></script>
</body>
</html>
