<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Nueva categoría</h1>

    <form id="form-categoria">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <input type="text" id="descripcion" class="form-control">
        </div>

        <div class="mb-3">
            <label>Precio (€)</label>
            <input type="number" id="precio" class="form-control" min="1" step="1" required>
        </div>

        <button class="btn btn-primary">Crear</button>

        <a href="/admin/categorias/index.html" class="btn btn-outline-danger mt-2">
            Cancelar
        </a>
    </form>
</div>

<script type="module" src="/js/admin/categorias/create.js"></script>
</body>
</html>
