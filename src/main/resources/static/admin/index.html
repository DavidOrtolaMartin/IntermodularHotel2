<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        .admin-panel {
            max-width: 560px; width: 100%;
            background: white; border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border: 1px solid #f1f5f9;
            padding: 2.5rem 2.5rem 2rem;
        }

        .admin-panel h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66; margin-bottom: 0.25rem;
        }

        .btn-hotel {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.45rem 1.1rem; border-radius: 999px;
            border: 1.5px solid #cbd5e1; background: white;
            color: #334155; font-size: 0.875rem; font-weight: 500;
            text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 1.5rem; margin-top: 0.25rem;
        }
        .btn-hotel:hover { border-color: #2563eb; color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        .admin-user {
            font-size: 0.875rem; color: #64748b;
            margin-bottom: 1.5rem; padding-bottom: 1.25rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .admin-user strong { color: #0b3b66; }

        .admin-links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }

        .admin-links a {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.9rem 1.25rem; border-radius: 12px;
            background: #f8fafc; border: 1px solid #f1f5f9;
            color: #0b3b66; font-weight: 500; font-size: 0.95rem;
            text-decoration: none; transition: background 0.18s, border-color 0.18s, transform 0.18s;
        }
        .admin-links a::after { content: '→'; color: #94a3b8; font-size: 1rem; transition: transform 0.18s, color 0.18s; }
        .admin-links a:hover { background: #eff6ff; border-color: #bfdbfe; transform: translateX(3px); }
        .admin-links a:hover::after { transform: translateX(3px); color: #2563eb; }
    </style>
</head>
<body>

<div class="admin-panel">

    <h1 class="mb-4">Panel de administración</h1>

    <a href="/index.html" class="btn-hotel">← Volver a Hotel Marquesado</a>

    <p class="admin-user">Bienvenido: <strong id="user-name"></strong></p>

    <ul class="admin-links">
        <li><a href="/admin/users/index.html">Gestión de usuarios</a></li>
		
		
        <li><a href="/admin/habitaciones/index.html">Gestión de habitaciones</a></li>
		
		
        <li><a href="/admin/categorias/index.html">Gestión de categorías</a></li>
		
		
        <li><a href="/admin/reservas/index.html">Gestión de reservas</a></li>
    </ul>

</div>

<script type="module" src="/js/admin/index.js"></script>
</body>
</html>
