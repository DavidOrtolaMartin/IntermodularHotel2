<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración de usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'DM Sans', sans-serif; }

        .container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66; margin-bottom: 0.2rem;
        }

        .container > .btn-outline-primary {
            border-radius: 999px;
            border: 1.5px solid #cbd5e1;
            background: white;
            color: #334155;
            font-size: 0.875rem;
            font-weight: 500;
            transition: border-color 0.2s, box-shadow 0.2s;
            padding: 0.5rem 1.1rem;
        }
        .container > .btn-outline-primary:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }

        .container > .btn-primary {
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            box-shadow: 0 3px 10px rgba(37,99,235,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .container > .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37,99,235,0.35);
        }

        .table-striped {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
        }

        .table-striped thead th {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #94a3b8;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 0.85rem 1.25rem;
        }

        .table-striped tbody td {
            padding: 1rem 1.25rem;
            vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            color: #334155;
        }

        .table-striped tbody tr:last-child td { border-bottom: none; }
        .table-striped tbody tr:hover td { background: #f8fafc; }
        .table-striped tbody tr.table-striped > * { --bs-table-bg: transparent; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Administración de usuarios</h1>

    
        <a href="/admin/index.html" class="btn btn-outline-primary mb-3">
        ← Volver al panel de administración
    </a>

    <a href="create.html" class="btn btn-primary mb-3">
        Nuevo usuario
    </a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Rol</th>
                <th>Provincia</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-usuarios"></tbody>
    </table>
</div>

<script type="module" src="/js/admin/users/index.js"></script>
</body>
</html>
