<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1 class="mb-4">Editar usuario</h1>

    <form id="form-user">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Apellido 1</label>
            <input type="text" id="apellido1" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Apellido 2</label>
            <input type="text" id="apellido2" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Teléfono 1</label>
            <input type="text" id="tlf1" class="form-control">
        </div>

        <div class="mb-3">
            <label>Teléfono 2</label>
            <input type="text" id="tlf2" class="form-control">
        </div>

        <div class="mb-3">
            <label>Rol</label>
            <input type="text" id="role" class="form-control" required>
        </div>

		<div class="mb-3">
		    <label>Provincia</label>
		    <select id="provinciaId" class="form-select" required>
		        <option value="">Selecciona una provincia</option>
		    </select>
		</div>

        <button class="btn btn-primary">Guardar</button>
    </form>
</div>

<script type="module" src="/js/admin/users/edit.js"></script>
</body>
</html>
