<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'DM Sans', sans-serif; }

        .container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 2rem !important;
        }

        #form-user {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
            padding: 2rem;
            max-width: 640px;
        }

        #form-user label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 0.35rem;
            display: block;
        }

        #form-user .form-control,
        #form-user .form-select {
            border-radius: 10px !important;
            border: 1.5px solid #e2e8f0 !important;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            padding: 0.6rem 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #form-user .form-control:focus,
        #form-user .form-select:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1) !important;
        }

        #form-user .btn-primary {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.5rem; border-radius: 999px; border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; font-size: 0.9rem; font-weight: 600;
            box-shadow: 0 3px 10px rgba(37,99,235,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
            margin-top: 0.5rem;
        }
        #form-user .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37,99,235,0.35);
        }
		
		#form-user .btn-secondary {
		    display: inline-flex; align-items: center; gap: 0.4rem;
		    padding: 0.6rem 1.3rem; border-radius: 999px;
		    border: 1.5px solid #fca5a5; background: white;
		    color: #ef4444; font-size: 0.9rem; font-weight: 500;
		    text-decoration: none;
		    transition: background 0.2s, border-color 0.2s;
		    margin-top: 0.5rem;
		}
		#form-user .btn-secondary:hover {
		    background: #fef2f2;
		    border-color: #ef4444;
		    color: #ef4444;
		}
		
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="mb-4">Editar usuario</h1>

    <form id="form-user">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Apellido 1</label>
            <input type="text" id="apellido1" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Apellido 2</label>
            <input type="text" id="apellido2" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Teléfono 1</label>
            <input type="text" id="tlf1" class="form-control">
        </div>

        <div class="mb-3">
            <label>Teléfono 2</label>
            <input type="text" id="tlf2" class="form-control">
        </div>

        <div class="mb-3">
            <label>Rol</label>
            <select id="role" class="form-select" required>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Provincia</label>
            <select id="provinciaId" class="form-select" required>
                <option value="">Selecciona una provincia</option>
            </select>
        </div>

        <button class="btn btn-primary">Guardar</button>
		<a href="index.html" class="btn btn-secondary">Cancelar</a>
		
    </form>
</div>

<script type="module" src="/js/admin/users/edit.js"></script>
</body>
</html>
