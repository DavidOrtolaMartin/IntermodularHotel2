<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar habitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Editar habitación</h1>

    <form id="form-habitacion">

        <div class="mb-3">
			<label id="label-num">Número habitación</label>
            <input type="number" id="numHabitacion" class="form-control" min="1">
        </div>

        <div class="mb-3">
			<label id="label-cat">Categoría</label>
            <select id="categoriaId" class="form-select"></select>
        </div>

        <button class="btn btn-primary">Guardar</button>
		<a href="/admin/habitaciones/index.html" class="btn btn-outline-danger mt-2">
		    Cancelar
		</a>
    </form>
</div>

<script type="module" src="/js/admin/habitaciones/edit.js"></script>
</body>
</html>
