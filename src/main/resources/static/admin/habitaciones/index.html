<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración de habitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        .hab-page { font-family: 'DM Sans', sans-serif; }

        .hab-header {
            display: flex; align-items: flex-end;
            justify-content: space-between; flex-wrap: wrap;
            gap: 1rem; margin-bottom: 2rem;
            padding-bottom: 1.25rem; border-bottom: 1px solid #e2e8f0;
        }

        .hab-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66; margin: 0;
        }

        .hab-header .subtitle {
            font-size: 0.875rem; color: #64748b; margin-top: 0.2rem;
        }

        .hab-header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

        .btn-back {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.1rem; border-radius: 999px;
            border: 1.5px solid #cbd5e1; background: white;
            color: #334155; font-size: 0.875rem; font-weight: 500;
            text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .btn-back:hover { border-color: #2563eb; color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        .btn-nueva {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.2rem; border-radius: 999px; border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; font-size: 0.875rem; font-weight: 600;
            text-decoration: none; box-shadow: 0 3px 10px rgba(37,99,235,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn-nueva:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37,99,235,0.35); color: white; }

        /* Tabla */
        .hab-table-wrap {
            background: white; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9; overflow: hidden;
        }

        .hab-table-wrap table {
            margin: 0; border-radius: 0;
            box-shadow: none;
        }

        .hab-table-wrap thead th {
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.07em; text-transform: uppercase;
            color: #94a3b8; background: #f8fafc;
            border-bottom: 1px solid #e2e8f0; padding: 0.85rem 1.1rem;
        }

        .hab-table-wrap tbody td {
            font-size: 0.875rem; color: #334155;
            padding: 0.85rem 1.1rem; vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
        }

        .hab-table-wrap tbody tr:last-child td { border-bottom: none; }

        .hab-table-wrap tbody tr:hover td { background: #f8fafc; }

        .hab-id {
            font-size: 0.75rem; font-weight: 600;
            color: #94a3b8; font-family: monospace;
        }

        .hab-num {
            font-weight: 600; color: #0b3b66;
        }

        .hab-precio {
            font-weight: 700; color: #2563eb;
        }

        .btn-accion {
            display: inline-flex; align-items: center;
            padding: 0.3rem 0.85rem; border-radius: 999px;
            font-size: 0.78rem; font-weight: 600;
            text-decoration: none; border: 1.5px solid;
            transition: background 0.15s, color 0.15s;
            margin-right: 0.3rem;
        }
        .btn-accion.editar {
            border-color: #2563eb; color: #2563eb; background: white;
        }
        .btn-accion.editar:hover { background: #eff6ff; }

        .btn-accion.borrar {
            border-color: #fca5a5; color: #ef4444; background: white;
            cursor: pointer;
        }
        .btn-accion.borrar:hover { background: #fef2f2; border-color: #ef4444; }
    </style>
</head>
<body class="hab-page">

<div class="container py-4">

    <div class="hab-header">
        <div>
            <h1>Habitaciones</h1>
            <p class="subtitle">Gestión de habitaciones disponibles en el hotel</p>
        </div>
        <div class="hab-header-actions">
            <a href="/admin/index.html" class="btn-back">← Panel admin</a>
            <a href="create.html" class="btn-nueva">+ Nueva habitación</a>
        </div>
    </div>

    <div class="hab-table-wrap">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Número</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-habitaciones"></tbody>
        </table>
    </div>

</div>

<script type="module" src="/js/admin/habitaciones/index.js"></script>
</body>
</html>
