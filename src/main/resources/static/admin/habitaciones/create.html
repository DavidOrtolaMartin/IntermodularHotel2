<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva habitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        .hab-page { font-family: 'DM Sans', sans-serif; }

        .hab-header {
            display: flex; align-items: flex-end;
            justify-content: space-between; flex-wrap: wrap;
            gap: 1rem; margin-bottom: 2rem;
            padding-bottom: 1.25rem; border-bottom: 1px solid #e2e8f0;
        }

        .hab-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66; margin: 0;
        }

        .hab-header .subtitle {
            font-size: 0.875rem; color: #64748b; margin-top: 0.2rem;
        }

        .hab-header-actions { display: flex; gap: 0.6rem; }

        .btn-back {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.1rem; border-radius: 999px;
            border: 1.5px solid #cbd5e1; background: white;
            color: #334155; font-size: 0.875rem; font-weight: 500;
            text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .btn-back:hover { border-color: #2563eb; color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        .form-card {
            background: white; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
            padding: 2rem; margin-bottom: 2rem;
            max-width: 520px;
        }

        .form-label-custom {
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em;
            text-transform: uppercase; color: #94a3b8;
            margin-bottom: 0.35rem; display: block;
        }

        .form-control, .form-select {
            border-radius: 10px !important;
            border: 1.5px solid #e2e8f0 !important;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem; padding: 0.6rem 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1) !important;
        }

        .form-actions {
            display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.75rem;
        }

        .btn-guardar {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.5rem; border-radius: 999px; border: none;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 3px 10px rgba(37,99,235,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn-guardar:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37,99,235,0.35); }

        .btn-cancelar {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.3rem; border-radius: 999px;
            border: 1.5px solid #fca5a5; background: white;
            color: #ef4444; font-size: 0.9rem; font-weight: 500;
            text-decoration: none; transition: background 0.2s, border-color 0.2s;
        }
        .btn-cancelar:hover { background: #fef2f2; border-color: #ef4444; }
    </style>
</head>
<body class="hab-page">

<div class="container py-4">

    <div class="hab-header">
        <div>
            <h1>Nueva habitación</h1>
            <p class="subtitle">Rellena los datos para crear una nueva habitación</p>
        </div>
        <div class="hab-header-actions">
            <a href="/admin/habitaciones/index.html" class="btn-back">← Volver</a>
        </div>
    </div>

    <div class="form-card">
        <form id="form-habitacion">

            <div class="mb-4">
                <label class="form-label-custom" for="numHabitacion">Número habitación</label>
                <input type="number" id="numHabitacion" class="form-control" step="1">
            </div>

            <div class="mb-4">
                <label class="form-label-custom" for="categoriaId">Categoría</label>
                <select id="categoriaId" class="form-select" required>
                    <option value="">Selecciona categoría</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-guardar">✓ Crear habitación</button>
                <a href="/admin/habitaciones/index.html" class="btn-cancelar">✕ Cancelar</a>
            </div>

        </form>
    </div>

</div>

<script type="module" src="/js/admin/habitaciones/create.js"></script>
</body>
</html>
