<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva habitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Nueva habitación</h1>

    <form id="form-habitacion">

        <div class="mb-3">
            <label>Número habitación</label>
            <input type="number" id="numHabitacion" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Categoría</label>
            <select id="categoriaId" class="form-select" required>
                <option value="">Selecciona categoría</option>
            </select>
        </div>

        <button class="btn btn-primary">Crear</button>
		<a href="/admin/habitaciones/index.html" class="btn btn-outline-danger mt-2">
		    Cancelar
		</a>
    </form>
</div>

<script type="module" src="/js/admin/habitaciones/create.js"></script>
</body>
</html>
