<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar reserva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Editar reserva</h1>

    <form id="form-reserva">

        <div class="mb-3">
            <label class="form-label">User ID</label>

            <input
                type="number"
                id="userId"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Habitación ID</label>

            <input
                type="number"
                id="habId"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha desde</label>

            <input
                type="date"
                id="fechaDesde"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha hasta</label>

            <input
                type="date"
                id="fechaHasta"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Pagado</label>

            <select
                id="pagado"
                class="form-select"
            >
                <option value="true">Sí</option>

                <option value="false">No</option>
            </select>
        </div>

        <button class="btn btn-primary">
            Guardar
        </button>

    </form>

</div>

<script type="module" src="/js/admin/reservas/edit.js"></script>

</body>
</html>
