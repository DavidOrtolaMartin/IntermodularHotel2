<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hotel Marquesado</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        /* Fondo */
        .hero {
            background-image: url("/images/hotel2.jpg");
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
            color: white;
        }

        /* Capa oscura para que se lea bien */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
        }

        /* Contenido centrado */
        .hero-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: bold;
        }

        .btn-reservar {
            margin-top: 20px;
            font-size: 1.5rem;
            padding: 12px 30px;
        }

        /* Navbar transparente */
        .navbar {
            position: absolute;
            width: 100%;
            z-index: 3;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">HOTEL MARQUESADO</a>

		<div class="ms-auto d-flex align-items-center">
		    
		    <a href="/habitaciones.html" class="btn btn-outline-light me-2">
		        Habitaciones
		    </a>

		    <!-- USUARIO LOGUEADO -->
		    <span id="user-name" class="text-white me-3"></span>

		    <!-- LOGIN -->
		    <a href="/login.html" class="btn btn-light" id="login-link">
		        Login
		    </a>

			<button class="btn btn-danger ms-2 d-none" id="logout-link">
			    Logout
			</button>
		</div>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <div class="overlay"></div>

    <div class="hero-content text-center">
        <h1>HOTEL MARQUESADO</h1>
        <p class="lead">Lujo, vistas y tranquilidad frente al mar</p>

        <a href="/reservas.html" class="btn btn-primary btn-reservar">
            Reservar ahora
        </a>
    </div>
</div>
<script type="module" src="/js/index.js"></script>
</body>
</html>
