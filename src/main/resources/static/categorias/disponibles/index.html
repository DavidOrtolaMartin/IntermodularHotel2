<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías disponibles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f8ff;
        }

        .header-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .title {
            font-weight: bold;
            color: #1e3a8a;
        }

        .back-btn {
            text-decoration: none;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3a8a;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="header-box mb-4">

        <div class="d-flex justify-content-between align-items-center">

            <h1 class="title m-0">Habitaciones disponibles</h1>

            <a href="/index.html" class="btn btn-outline-primary">
                ← Volver al inicio
            </a>

        </div>

        <p id="fechas-seleccionadas" class="text-muted mt-2 mb-0"></p>

    </div>

    <!-- LISTA -->
    <div id="lista-categorias" class="row g-4">
        <!-- aquí se pintarán las categorías -->
    </div>

</div>

<script type="module" src="/categorias/disponibles/index.js"></script>

</body>
</html>
