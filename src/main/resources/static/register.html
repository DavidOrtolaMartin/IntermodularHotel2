<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1>Registro</h1>

    <form id="form-register">

        <div class="mb-3">
            <label>Nombre</label>

            <input
                id="name"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Apellido 1</label>

            <input
                id="apellido1"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Apellido 2</label>

            <input
                id="apellido2"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Email</label>

            <input
                id="email"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Teléfono 1</label>

            <input
                id="tlf1"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Teléfono 2</label>

            <input
                id="tlf2"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Provincia</label>

            <select
                id="provinciaId"
                class="form-select"
            >
                <option value="">
                    Selecciona una provincia
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Password</label>

            <input
                id="password"
                type="password"
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label>Confirmar password</label>

            <input
                id="password2"
                type="password"
                class="form-control"
            >
        </div>

        <button class="btn btn-primary">
            Registrarse
        </button>

        <div
            id="error"
            class="alert alert-danger mt-3"
            style="display:none"
        ></div>

        <div
            id="success"
            class="alert alert-success mt-3"
            style="display:none"
        ></div>

    </form>

</div>

<script type="module" src="/js/auth/register.js"></script>

</body>
</html>
