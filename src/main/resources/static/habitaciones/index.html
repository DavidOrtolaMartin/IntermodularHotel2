<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Habitaciones disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'DM Sans', sans-serif; }

        .hab-header {
            display: flex; align-items: flex-end;
            justify-content: space-between; flex-wrap: wrap;
            gap: 1rem; margin-bottom: 2rem;
            padding-bottom: 1.25rem; border-bottom: 1px solid #e2e8f0;
        }

        .hab-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; color: #0b3b66; margin: 0;
        }

        .hab-header .subtitle { font-size: 0.875rem; color: #64748b; margin-top: 0.2rem; }

        .btn-back {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1.1rem; border-radius: 999px;
            border: 1.5px solid #cbd5e1; background: white;
            color: #334155; font-size: 0.875rem; font-weight: 500;
            text-decoration: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .btn-back:hover { border-color: #2563eb; color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

        .table-wrap {
            background: white; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9; overflow: hidden;
        }

        .table-wrap table { margin: 0; }

        .table-wrap thead th {
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.07em; text-transform: uppercase;
            color: #94a3b8; background: #f8fafc;
            border-bottom: 1px solid #e2e8f0; padding: 0.85rem 1.25rem;
        }

        .table-wrap tbody td {
            padding: 1rem 1.25rem; vertical-align: middle;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem; color: #334155;
        }

        .table-wrap tbody tr:last-child td { border-bottom: none; }
        .table-wrap tbody tr:hover td { background: #f8fafc; }

        .cat-nombre {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem; color: #0b3b66; font-weight: 600;
        }

        .cat-desc { color: #64748b; font-size: 0.85rem; line-height: 1.5; }

        .cat-precio { font-weight: 700; color: #2563eb; font-size: 1rem; }
        .cat-precio span { font-size: 0.75rem; font-weight: 400; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="hab-header">
        <div>
            <h1>Nuestras habitaciones</h1>
            <p class="subtitle">Descubre todas las categorías disponibles</p>
        </div>
        <a href="/" class="btn-back">← Volver al inicio</a>
    </div>

    <div class="table-wrap">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody id="tabla-categorias"></tbody>
        </table>
    </div>

</div>

<script type="module" src="/habitaciones/index.js"></script>
</body>
</html>
